name: formae · apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "part-2-agent-cicd/02-cicd/**"
      - ".github/workflows/formae-*.yml"

concurrency:
  group: formae-apply
  cancel-in-progress: false  # never cancel a running apply

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install formae
        run: |
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | tr -d '_' | sed s/aarch64/arm64/)
          curl -fsSL "https://hub.platform.engineering/get/binaries/${OS}-${ARCH}/pelmgr" \
            -o /tmp/pelmgr && chmod +x /tmp/pelmgr
          sudo /tmp/pelmgr install formae@0.90.0 standard --yes
          echo "/opt/pel/bin" >> "$GITHUB_PATH"

      - name: Join Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write agent profile
        env:
          FORMAE_AGENT_FQDN: ${{ secrets.FORMAE_AGENT_FQDN }}
          FORMAE_API_PASSWORD: ${{ secrets.FORMAE_API_PASSWORD }}
        run: |
          mkdir -p ~/.config/formae/profiles
          cat > ~/.config/formae/profiles/bootstrap.pkl << EOF
          amends "formae:/Config.pkl"
          import "formae:/Config.pkl" as Config
          import "plugins:/AuthBasic.pkl" as AuthBasic
          cli {
            connection = new Config.Classic {
              url = "https://${FORMAE_AGENT_FQDN}"
              port = 49684
              auth = new AuthBasic.CliConfig {
                username = "formae"
                password = "${FORMAE_API_PASSWORD}"
              }
            }
          }
          EOF

      # GitOps design: no --force. Portal drift fails the pipeline loud so a
      # human can `formae extract` the drift into PKL and open a PR. PKL is the
      # single source of truth; CI never silently overwrites out-of-band edits.
      - name: Apply
        id: apply
        run: |
          set +e
          formae apply --mode reconcile --yes --profile bootstrap \
            --output-consumer machine --output-schema json \
            part-2-agent-cicd/02-cicd/main.pkl > /tmp/apply.json 2>&1
          EXIT=$?
          set -e

          ERROR=$(jq -re '.error'      /tmp/apply.json 2>/dev/null || echo "")
          CODE=$( jq -re '.data.Code'  /tmp/apply.json 2>/dev/null || echo "")

          # No changes to apply — idempotent success.
          if [ "$ERROR" = "DriftResolutionRejected" ]; then
            echo "No changes to apply."
            echo "cmd_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Portal drift blocks the apply. Surface it clearly and fail.
          if [ "$ERROR" = "ReconcileRejected" ]; then
            echo "::error title=Out-of-band drift detected::A managed resource was modified outside formae. CI will not silently overwrite it."
            echo ""
            echo "Drifted resources:"
            jq -r '.data.ModifiedStacks | to_entries[] | .value.ModifiedResources[]
                   | "  - \(.Type) \(.Label) (stack: \(.Stack))"' /tmp/apply.json
            echo ""
            echo "Next steps for the operator:"
            echo "  1. Investigate the change (Azure Portal audit log)."
            echo "  2. If the change should stay:"
            echo "       formae extract --query 'stack:<stack> label:<label>' > drift.pkl"
            echo "     merge drift.pkl into part-2-agent-cicd/02-cicd/main.pkl, open a PR."
            echo "  3. If the change should be reverted:"
            echo "       revert it in Azure Portal (or via 'az ...') then re-run this workflow."
            exit 1
          fi

          # Any other non-zero exit is an unexpected failure.
          if [ $EXIT -ne 0 ]; then
            echo "Apply failed unexpectedly:" >&2
            cat /tmp/apply.json >&2
            exit 1
          fi

          CMD_ID=$(jq -r '.CommandId' /tmp/apply.json)
          if [ -z "$CMD_ID" ] || [ "$CMD_ID" = "null" ]; then
            echo "Apply returned no CommandId — nothing dispatched." >&2
            cat /tmp/apply.json >&2
            exit 1
          fi
          echo "Dispatched command: $CMD_ID"
          echo "cmd_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for completion
        if: steps.apply.outputs.cmd_id != ''
        run: |
          CMD_ID="${{ steps.apply.outputs.cmd_id }}"
          echo "Polling command ${CMD_ID} ..."
          while :; do
            STATE=$(formae command status "$CMD_ID" --profile bootstrap \
              --output-consumer machine --output-schema json \
              | jq -r '.Commands[0].State')
            echo "  state: ${STATE}"
            case "$STATE" in
              Success)          echo "Apply succeeded."; break ;;
              Failed|Canceled)  echo "Apply ${STATE}." >&2; exit 1 ;;
              *)                sleep 10 ;;
            esac
          done
