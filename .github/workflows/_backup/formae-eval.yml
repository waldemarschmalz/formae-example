name: formae · eval & simulate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "part-2-agent-cicd/02-cicd/**"
      - ".github/workflows/formae-*.yml"

concurrency:
  group: formae-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval & simulate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install formae
        run: |
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | tr -d '_' | sed s/aarch64/arm64/)
          curl -fsSL "https://hub.platform.engineering/get/binaries/${OS}-${ARCH}/pelmgr" \
            -o /tmp/pelmgr && chmod +x /tmp/pelmgr
          sudo /tmp/pelmgr install formae@0.90.0 standard --yes
          echo "/opt/pel/bin" >> "$GITHUB_PATH"

      - name: Validate PKL (no agent contact)
        run: formae eval part-2-agent-cicd/02-cicd/main.pkl
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Join Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write agent profile
        env:
          FORMAE_AGENT_FQDN: ${{ secrets.FORMAE_AGENT_FQDN }}
          FORMAE_API_PASSWORD: ${{ secrets.FORMAE_API_PASSWORD }}
        run: |
          mkdir -p ~/.config/formae/profiles
          cat > ~/.config/formae/profiles/bootstrap.pkl << EOF
          amends "formae:/Config.pkl"
          import "formae:/Config.pkl" as Config
          import "plugins:/AuthBasic.pkl" as AuthBasic
          cli {
            connection = new Config.Classic {
              url = "https://${FORMAE_AGENT_FQDN}"
              port = 49684
              auth = new AuthBasic.CliConfig {
                username = "formae"
                password = "${FORMAE_API_PASSWORD}"
              }
            }
          }
          EOF

      # Read-only preview of what a merge would attempt to change. --force here
      # only affects the CLI-side out-of-band prompt (which we can't answer in
      # CI); it does not mutate anything.
      - name: Simulate (drift preview)
        id: simulate
        run: |
          set +e
          formae apply --mode reconcile --simulate --force --yes --profile bootstrap \
            --output-consumer machine --output-schema json \
            part-2-agent-cicd/02-cicd/main.pkl > /tmp/sim.json 2>&1
          set -e

          ERROR=$(jq -re '.error'      /tmp/sim.json 2>/dev/null || echo "")
          CODE=$( jq -re '.data.Code'  /tmp/sim.json 2>/dev/null || echo "")

          if [ "$ERROR" = "DriftResolutionRejected" ] && [ "$CODE" = "stale-review" ]; then
            echo "kind=stale"   >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              echo "A previous review is still pending on the agent (from an earlier eval run)."
              echo "Merge the branch that owns that review, or wait for it to expire, then re-run."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$ERROR" = "DriftResolutionRejected" ]; then
            echo "kind=nochange" >> "$GITHUB_OUTPUT"
            echo "summary=No changes required." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$ERROR" ] && jq -re '.ChangesRequired == false' /tmp/sim.json >/dev/null 2>&1; then
            echo "kind=nochange" >> "$GITHUB_OUTPUT"
            echo "summary=No changes required." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$ERROR" ] && jq -re '.ChangesRequired == true' /tmp/sim.json >/dev/null 2>&1; then
            SUMMARY=$(jq -r '
              "Changes required:",
              (.Command.ResourceUpdates[] | (
                "  \(.Operation | ascii_upcase)  \(.ResourceType)  \(.ResourceLabel)",
                (.Properties | to_entries[] |
                  "    \(.key): \(if (.value | type) == "object" then (.value | tostring) else .value end)"
                )
              ))' /tmp/sim.json)
            echo "kind=changes" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              echo "$SUMMARY"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Simulate failed:" >&2
          cat /tmp/sim.json >&2
          exit 1
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN:   ${{ github.token }}
          KIND:       ${{ steps.simulate.outputs.kind }}
          SUMMARY:    ${{ steps.simulate.outputs.summary }}
          SHA:        ${{ github.sha }}
          PR_NUMBER:  ${{ github.event.pull_request.number }}
        run: |
          case "$KIND" in
            nochange) ICON="✅"; TITLE="No changes required" ;;
            changes)  ICON="⚠️"; TITLE="Changes required" ;;
            stale)    ICON="⏳"; TITLE="Stale review — cannot preview" ;;
            *)        ICON="❓"; TITLE="Unknown state" ;;
          esac
          printf '%s **formae · %s**\n\n```\n%s\n```\n\n*Triggered by `%s` — merge to apply.*\n' \
            "$ICON" "$TITLE" "$SUMMARY" "$SHA" > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --edit-last --body-file /tmp/pr-comment.md 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
