name: formae · eval & simulate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "part-2-agent-cicd/02-cicd/**"
      - ".github/workflows/formae-*.yml"

concurrency:
  group: formae-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Eval & simulate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Install formae
        run: |
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | tr -d '_' | sed s/aarch64/arm64/)
          curl -fsSL "https://hub.platform.engineering/get/binaries/${OS}-${ARCH}/pelmgr" \
            -o /tmp/pelmgr && chmod +x /tmp/pelmgr
          sudo /tmp/pelmgr install formae@0.90.0 standard --yes
          echo "/opt/pel/bin" >> "$GITHUB_PATH"

      - name: Validate PKL (no agent contact)
        run: formae eval part-2-agent-cicd/02-cicd/main.pkl
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Join Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write agent profile
        env:
          FORMAE_AGENT_FQDN: ${{ secrets.FORMAE_AGENT_FQDN }}
          FORMAE_API_PASSWORD: ${{ secrets.FORMAE_API_PASSWORD }}
        run: |
          mkdir -p ~/.config/formae/profiles
          cat > ~/.config/formae/profiles/bootstrap.pkl << EOF
          amends "formae:/Config.pkl"
          import "formae:/Config.pkl" as Config
          import "plugins:/AuthBasic.pkl" as AuthBasic
          cli {
            connection = new Config.Classic {
              url = "https://${FORMAE_AGENT_FQDN}"
              port = 49684
              auth = new AuthBasic.CliConfig {
                username = "formae"
                password = "${FORMAE_API_PASSWORD}"
              }
            }
          }
          EOF

      - name: Simulate (drift preview)
        id: simulate
        run: |
          # --force: surface out-of-band changes instead of blocking with ReconcileRejected.
          # formae exits non-zero when ChangesRequired=false (DriftResolutionRejected).
          # Capture output regardless, then validate JSON before branching.
          SIM=$(formae apply --mode reconcile --simulate --force --yes --profile bootstrap \
            --output-consumer machine --output-schema json \
            part-2-agent-cicd/02-cicd/main.pkl) || true
          if ! echo "$SIM" | jq -re '.ChangesRequired != null' > /dev/null 2>&1; then
            echo "Simulate failed (no valid JSON):" >&2
            echo "$SIM" >&2
            exit 1
          fi
          DRIFT=$(echo "$SIM" | jq -r '.ChangesRequired')
          echo "changes_required=${DRIFT}" >> "$GITHUB_OUTPUT"

          SUMMARY=$(echo "$SIM" | jq -r '
            if .ChangesRequired then
              "Changes required:",
              (.Command.ResourceUpdates[] | (
                "  \(.Operation | ascii_upcase)  \(.ResourceType)  \(.ResourceLabel)",
                (.Properties | to_entries[] |
                  "    \(.key): \(if (.value | type) == "object" then (.value | tostring) else .value end)"
                )
              ))
            else
              "No changes required."
            end')
          echo "$SUMMARY"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SUMMARY"       >> "$GITHUB_OUTPUT"
          echo "EOF"            >> "$GITHUB_OUTPUT"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Post PR comment
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DRIFT: ${{ steps.simulate.outputs.changes_required }}
          SUMMARY: ${{ steps.simulate.outputs.summary }}
          SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "$DRIFT" = "true" ]; then
            ICON="⚠️"
            TITLE="Changes required"
          else
            ICON="✅"
            TITLE="No changes required"
          fi
          printf '%s **formae · %s**\n\n```\n%s\n```\n\n*Triggered by `%s` — merge to apply.*\n' \
            "$ICON" "$TITLE" "$SUMMARY" "$SHA" > /tmp/pr-comment.md
          gh pr comment "$PR_NUMBER" --edit-last --body-file /tmp/pr-comment.md 2>/dev/null \
            || gh pr comment "$PR_NUMBER" --body-file /tmp/pr-comment.md
