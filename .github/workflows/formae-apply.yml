name: formae · apply

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "part-2-agent-cicd/02-cicd/**"
      - ".github/workflows/formae-*.yml"

concurrency:
  group: formae-apply
  cancel-in-progress: false  # never cancel a running apply

jobs:
  apply:
    name: Apply
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install formae
        run: |
          OS=$(uname | tr '[:upper:]' '[:lower:]')
          ARCH=$(uname -m | tr -d '_' | sed s/aarch64/arm64/)
          curl -fsSL "https://hub.platform.engineering/get/binaries/${OS}-${ARCH}/pelmgr" \
            -o /tmp/pelmgr && chmod +x /tmp/pelmgr
          sudo /tmp/pelmgr install formae@0.90.0 standard --yes
          echo "/opt/pel/bin" >> "$GITHUB_PATH"

      - name: Join Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Write agent profile
        env:
          FORMAE_AGENT_FQDN: ${{ secrets.FORMAE_AGENT_FQDN }}
          FORMAE_API_PASSWORD: ${{ secrets.FORMAE_API_PASSWORD }}
        run: |
          mkdir -p ~/.config/formae/profiles
          cat > ~/.config/formae/profiles/bootstrap.pkl << EOF
          amends "formae:/Config.pkl"
          import "formae:/Config.pkl" as Config
          import "plugins:/AuthBasic.pkl" as AuthBasic
          cli {
            connection = new Config.Classic {
              url = "https://${FORMAE_AGENT_FQDN}"
              port = 49684
              auth = new AuthBasic.CliConfig {
                username = "formae"
                password = "${FORMAE_API_PASSWORD}"
              }
            }
          }
          EOF

      - name: Apply
        id: apply
        run: |
          # Simulate first to create a review token the agent requires.
          # If simulate returns stale-review, a valid review from the PR eval
          # already exists on the agent — skip directly to apply to consume it.
          SIM=$(formae apply --mode reconcile --simulate --force --yes --profile bootstrap \
            --output-consumer machine --output-schema json \
            part-2-agent-cicd/02-cicd/main.pkl) || true

          STALE=$(echo "$SIM" | jq -re 'if .data.Code == "stale-review" then "true" else "false" end' 2>/dev/null || echo "false")
          DRIFT=$(echo "$SIM"  | jq -re '.ChangesRequired' 2>/dev/null || echo "")

          if [ "$STALE" = "true" ]; then
            echo "Existing review on agent is current — proceeding to apply."
          elif [ "$DRIFT" = "false" ]; then
            echo "No changes — skipping apply."
            echo "cmd_id=" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$DRIFT" != "true" ]; then
            echo "Simulate failed:" >&2
            echo "$SIM" >&2
            exit 1
          else
            echo "$SIM" | jq -r '
              "Planned changes:",
              (.Command.ResourceUpdates[] | (
                "  \(.Operation | ascii_upcase)  \(.ResourceType)  \(.ResourceLabel)",
                (.Properties | to_entries[] |
                  "    \(.key): \(if (.value | type) == "object" then (.value | tostring) else .value end)"
                )
              ))'
          fi

          CMD_ID=$(formae apply --mode reconcile --force --yes --profile bootstrap \
            --output-consumer machine --output-schema json \
            part-2-agent-cicd/02-cicd/main.pkl | jq -r '.CommandId')
          echo "cmd_id=${CMD_ID}" >> "$GITHUB_OUTPUT"
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Wait for completion
        run: |
          CMD_ID="${{ steps.apply.outputs.cmd_id }}"
          if [ -z "$CMD_ID" ]; then
            echo "No changes — skipping poll."
            exit 0
          fi
          echo "Polling command ${CMD_ID} ..."
          while :; do
            STATE=$(formae command status "$CMD_ID" --profile bootstrap \
              --output-consumer machine --output-schema json \
              | jq -r '.Commands[0].State')
            echo "  state: ${STATE}"
            case "$STATE" in
              Success)          echo "Apply succeeded."; break ;;
              Failed|Canceled)  echo "Apply ${STATE}." >&2; exit 1 ;;
              *)                sleep 10 ;;
            esac
          done
